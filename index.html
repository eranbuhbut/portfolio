<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f7">

  <title>Eran Buhbut | Mechanical engineering student</title>

  <meta name="description" content="Mechanical engineering student at the Technion. Soft robotics, mechatronics, CAD and 3D printing projects.">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Eran Buhbut">
  <meta property="og:description" content="Mechanical engineering student at the Technion. My own projects: what I built, what failed, and what I changed.">
  <meta property="og:image" content="media/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

:root {
  --t-small: 15px;         
  --t-body: 18px;          
  --t-lead: 22px;          
  --t-sub: 28px;           
  --t-title: 36px;         
  --t-display: clamp(44px,6.6vw,90px);  
  --bg: #f5f6f7;  
  --panel: #fff;  
  --ink: #161616;  
  --mut: #4d545b;  
  --line: #c8cdd2;  
  --ph: #e4e7ea;
  --tint: #e9eff3;
  --grid: rgba(63,103,131,.125);  
  --blue: #3f6783;  
  --acc: #3f6783;             
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  scroll-behavior: smooth;
  scrollbar-color: var(--blue) var(--bg);  
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "IBM Plex Sans","Segoe UI",Arial,sans-serif;
  font-weight: 300;
  font-size: var(--t-body);
  line-height: 1.65;
  position: relative;
}

.pick {
  counter-reset: pk;
}
.pk {
  counter-increment: pk;
}
.pk h3::before {
  content: counter(pk,decimal-leading-zero);
  display: block;
  font-weight: 500;
  font-size: var(--t-small);
  letter-spacing: .08em;
  font-variant-numeric: tabular-nums;
  color: var(--blue);
  margin-bottom: 4px;
}

body::before {
  content: "";
  display: block;
  height: 5px;
  background: linear-gradient(to right,var(--blue) 0 68%,var(--acc) 68% 100%);
}

::selection {
  background: var(--acc);
  color: #fff;
}
a {
  color: inherit;
  text-underline-offset: .2em;
}

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
}

h1 {
  font-weight: 300;
  font-size: var(--t-display);
  line-height: 1.16;
  letter-spacing: -.03em;
}

h1 mark {
  color: var(--bg);
  background: linear-gradient(var(--blue),var(--blue)) no-repeat 100% 62%/100% 74%;  
  padding: 0 .2em;
  white-space: nowrap;
  border-radius: 8px;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  animation: sweep 1s .35s cubic-bezier(.2,.7,.2,1) backwards;
}
[dir=ltr] h1 mark {
  background-position: 0 62%;
}
@keyframes sweep {
  from {
    background-size: 0% 74%;
    color: var(--ink);
  }
  45% {
    color: var(--ink);
  }
  to {
    background-size: 100% 74%;
    color: var(--bg);
  }
}

h1, h2, h3 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

h2 {
  font-weight: 500;
  font-size: var(--t-title);
  line-height: 1.2;
  letter-spacing: -.01em;
  margin-bottom: 34px;
}

h2::after {
  content: "";
  display: block;
  width: 44px;  
  height: 3px;
  background: var(--acc);
  margin-top: 12px;
}

h3 {
  font-weight: 500;
  font-size: var(--t-lead);
  line-height: 1.3;
}

.proj-head h3 {
  font-weight: 500;
  font-size: var(--t-sub);
  line-height: 1.2;
}

.lead, .hero p {
  font-weight: 300;
  font-size: var(--t-lead);
}

.step p, .note p, .two p {
  font-size: var(--t-body);
  color: var(--mut);
}

.slide p, .vids p, .tag, .pk small, footer {
  font-size: var(--t-small);
  color: var(--mut);
}

.step b {
  display: block;
  font-weight: 500;
  font-size: var(--t-body);
  color: var(--ink);
  margin-bottom: 12px;
}
.step b::after {
  content: "";
  display: block;
  height: 3px;
  width: 44px;
  margin-top: 8px;
  background: var(--blue);
}

.pk .st {
  position: absolute;      
  top: 16px;
  inset-inline-end: 18px;
  line-height: 1.3;        
  font-weight: 500;
  font-size: var(--t-small);
  color: var(--blue);
  white-space: nowrap;
}

.big {
  font-weight: 300;
  font-size: var(--t-sub);
  text-wrap: balance;
  text-decoration: none;
  border-bottom: 1px solid var(--acc);
  padding-bottom: 2px;
}

.wrap {
  max-width: 1120px;
  margin-inline: auto;
  padding-inline: clamp(20px,5vw,48px);
}

header {
  width: 100%;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(245,246,247,.88);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
}
.header-inner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-block: 24px;
}
header nav {
  display: flex;
  gap: 31px;
  font-size: var(--t-body);
}
header nav a {
  text-decoration: none;
  color: var(--mut);
}
header nav a:hover {
  color: var(--blue);
}

.hr {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-inline-start: auto;
}

.who {
  margin: 56px 0 0;
}
.nm {
  font-weight: 500;
  font-size: var(--t-title);
  line-height: 1.2;
}
.rl {
  font-size: var(--t-lead);
  color: var(--mut);
  margin-top: 6px;
}

.menu {
  display: none;
  flex-direction: column;
  gap: 5px;
  align-items: center;
  justify-content: center;
  width: 46px;
  height: 38px;
  padding: 0;
  border: 1px solid var(--ink);
  border-radius: 99px;
  background: none;
  cursor: pointer;
}
.menu i {
  display: block;
  width: 18px;
  height: 2px;
  background: var(--ink);
  transition: transform .25s,opacity .25s;
}
.menu[aria-expanded=true] i:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}
.menu[aria-expanded=true] i:nth-child(2) {
  opacity: 0;
}
.menu[aria-expanded=true] i:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.lang {
  display: inline-block;
  text-decoration: none;
  border: 1px solid var(--ink);
  background: none;
  color: var(--ink);
  font: 500 var(--t-body) "IBM Plex Sans",sans-serif;
  padding: 6px 17px;
  border-radius: 99px;
  cursor: pointer;
}
.lang:hover {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;  
  gap: 48px;
  align-items: center;
  padding-block: 68px 88px;
}
.hero p {
  margin-top: 30px;
  max-width: 30em;
}

.frame {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  border-radius: 6px;
  background: var(--ph);
}
.frame img, .frame video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.hero .plate {
  max-width: 420px;
  width: 100%;
  justify-self: end;
}
.hero .frame {
  aspect-ratio: 4/5;
  border-bottom: 4px solid var(--acc);
}
.slide .frame, .vids .frame {
  border-bottom: 4px solid var(--blue);
}

section {
  padding-block: 80px;
  border-top: 1px solid var(--line);
}

.pick {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 24px;
}
.pk {
  display: flex;
  flex-direction: column;
  text-align: start;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0;
  cursor: pointer;
  font: inherit;
  color: inherit;
  overflow: hidden;
  transition: border-color .25s,box-shadow .25s;
}
.pk:hover {
  border-color: var(--blue);
}
.pk[aria-expanded=true] {
  border-color: var(--blue);
  box-shadow: inset 0 -3px 0 var(--acc);  
}
.pk .th {
  aspect-ratio: 16/10;
  background: var(--ph);
  overflow: hidden;
}
.pk .th img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}

.pk:hover .th img {
  transform: scale(1.04);  
}
.pk .bd {
  position: relative;
  padding: 20px 22px 22px;
  border-top: 1px solid var(--line);
}
.pk h3 {
  font-size: var(--t-lead);
  font-weight: 500;
}
.pk h3::before {
  content: none;
}
.pk small {
  display: block;
  line-height: 1.45;
  font-size: var(--t-body);
  margin-top: 6px;
}

.pp {
  display: grid;
  grid-template-rows: 0fr;  
  transition: grid-template-rows .55s ease;
}
.pp.open {
  grid-template-rows: 1fr;
}
.pw {
  overflow: hidden;
  min-height: 0;
}
.in {
  padding-top: 56px;
}

.proj-head {
  margin-bottom: 48px;
}
.proj-head .lead {
  margin-top: 22px;
  max-width: 44em;
}
.tag {
  margin-top: 10px;
}

.steps {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  margin-bottom: 52px;
}
.step {
  padding: 22px 24px 4px;
  border-inline-start: 1px solid var(--line);
}
.step:first-child {
  border-inline-start: 0;
  padding-inline-start: 0;
}

.car {
  position: relative;
  margin-bottom: 52px;
  overflow: hidden;
}
.track {
  display: flex;
  transition: transform .5s cubic-bezier(.3,.7,.2,1);
}
.slide {
  flex: 0 0 100%;
  display: grid;
  grid-template-columns: minmax(220px,330px) 1fr;
  gap: 36px;
  align-items: center;     
}
.slide .frame {
  aspect-ratio: 4/4.6;
}
.slide p {
  max-width: 26em;
  padding-bottom: 8px;
}
.ctl {
  display: flex;
  gap: 12px;
  align-items: center;
  margin-top: 22px;
}
.ctl button {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: 1px solid var(--ink);
  background: none;
  color: var(--ink);
  cursor: pointer;
  font-size: var(--t-body);
}
.ctl button:hover {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}
.dots {
  display: flex;
  gap: 8px;
  margin-inline-start: 12px;
}
.dots i {
  width: 22px;
  height: 3px;
  background: var(--line);
  transition: background .3s;
}
.dots i.on {
  background: var(--acc);
}

.vids {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  max-width: 640px;
  margin-bottom: 48px;
}
.vids:not(.gal):not(.vid-one) .frame {
  aspect-ratio: 4/4.5;
}
.vids p {
  margin-top: 10px;
}

.note {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
}

.two {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 56px;
}
.links {
  display: flex;
  gap: 26px;
  margin-top: 26px;
  font-size: var(--t-body);
  flex-wrap: wrap;
}
.links a:hover {
  color: var(--blue);
}

footer {
  padding-block: 36px;
  border-top: 1px solid var(--line);
}

.xr {
  display: grid;
  grid-template-columns: 200px 1fr;
  gap: 32px;
  padding: 26px 0;
  border-top: 1px solid var(--line);
}
.xp .xr:last-child {
  border-bottom: 1px solid var(--line);
}
.xw {
  font-variant-numeric: tabular-nums;
  font-weight: 500;
  font-size: var(--t-small);
  color: var(--blue);
  padding-top: 5px;
}
.xr p {
  font-size: var(--t-body);
  color: var(--mut);
  margin-top: 6px;
}

.btn {
  display: inline-block;
  margin-top: 36px;
  border: 1px solid var(--blue);
  border-radius: 99px;
  padding: 10px 24px;
  font-weight: 500;
  font-size: var(--t-body);
  text-decoration: none;
  background: var(--blue);
  color: #fff;
  transition: background .2s,color .2s,border-color .2s;
}
.btn:hover {
  background: transparent;
  border-color: var(--ink);
  color: var(--ink);
}

@media (max-width:820px) {
  .hero, .proj-head, .note, .two {
    grid-template-columns: 1fr;
    gap: 32px;
  }
  .hero .plate {
    max-width: 100%;
    justify-self: stretch;
  }
  .steps {
    grid-template-columns: 1fr;
  }
  .step {
    border-inline-start: 0;
    border-top: 1px solid var(--line);
    padding-inline: 0;
  }
  .step:first-child {
    border-top: 0;
    padding-top: 0;
  }
  .slide {
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .vids {
    grid-template-columns: 1fr;
  }
  .header-inner {
    position: relative;
  }
  .xr {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  header nav {
    display: none;
    position: absolute;
    inset-inline: clamp(20px,5vw,48px);
    top: calc(100% + 10px);
    flex-direction: column;
    gap: 0;
    padding: 8px 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    z-index: 20;
  }
  header.open nav {
    display: flex;
  }
  header nav a {
    padding: 14px 22px;
    font-size: var(--t-body);
    color: var(--ink);
  }
  .menu {
    display: flex;
  }
  .pick {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion:reduce) {
  h1 mark {
    animation: none;
  }
  .track, .pp, .pk, .pk .th img {
    transition: none;
  }
  .pk:hover .th img {
    transform: none;
  }
  html {
    scroll-behavior: auto;
  }
}
html {
  scroll-padding-top: 92px;
}
header.stuck {
  box-shadow: 0 10px 24px -18px rgba(0,22,40,.45);
}
header nav a.cur {
  color: var(--blue);
  text-decoration: underline;
  text-decoration-thickness: 2px;
  text-underline-offset: 9px;
}
@media (max-width:820px) {
  header nav a.cur {
    text-underline-offset: 6px;
  }
}
#contact .links {
  margin-top: 0;
  gap: 18px 44px;
}
.cl {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: var(--t-lead);
  text-decoration: none;
  border-bottom: 1px solid var(--blue);
  padding-bottom: 2px;
}
.cl svg {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.gal {
  grid-template-columns: repeat(3,1fr);
  max-width: 880px;
}
.gal .frame {
  aspect-ratio: 4/3;
}
.vid-one {
  grid-template-columns: minmax(0,360px);
}
.vid-one .frame {
  aspect-ratio: 1/1;
}
@media (max-width:820px) {
  .gal {
    grid-template-columns: 1fr;
  }
}
body::after {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: min(100vh,880px);
  z-index: -1;
  pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse 75% 85% at 72% 35%,#000 20%,transparent 75%);
  mask-image: radial-gradient(ellipse 75% 85% at 72% 35%,#000 20%,transparent 75%);
}
.plate {
  position: relative;
}
.plate::after {
  content: "";
  position: absolute;
  inset: -14px;
  pointer-events: none;
  background:
    linear-gradient(var(--blue),var(--blue)) 0 0/20px 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 0 0/1px 20px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 100% 0/20px 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 100% 0/1px 20px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 0 100%/20px 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 0 100%/1px 20px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 100% 100%/20px 1px no-repeat,
    linear-gradient(var(--blue),var(--blue)) 100% 100%/1px 20px no-repeat;
}
.xp {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 36px;
}
.xp .xr:first-child {
  border-top: 0;
}
.xp .xr:last-child {
  border-bottom: 0;
}
.xr h3 {
  font-size: var(--t-lead);
  font-weight: 500;
}
#maker .two {
  background: var(--tint);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 40px 44px;
  align-items: center;
}
#maker .links {
  margin: 0;
}
#maker .btn {
  margin: 0;
}
.portrait {
  aspect-ratio: 4/5;
  overflow: hidden;
  border-radius: 6px;
  border-bottom: 4px solid var(--blue);
  max-width: 215px;
}
.portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
  display: block;
}
.about {
  display: grid;
  gap: 48px;
  align-items: start;
}
@media (min-width:821px) {
  .hero {
    grid-template-columns: 1.15fr 0.95fr;
    min-height: calc(100vh - 92px);
  }
  .about {
    grid-template-columns: 215px 1fr 1fr;
  }
}
@media (max-width:820px) {
  .about {
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .xp {
    padding: 0 20px;
  }
  #maker .two {
    padding: 28px 24px;
  }
}
.pk .st {
  position: static;
  display: block;
  margin-top: 12px;
  font-size: var(--t-small);
}
</style>
</head>
<body>
    <header>
      <div class="wrap header-inner">
        <nav id="nav">
          <a href="#projects">Projects</a>
          <a href="#experience">Experience</a>
          <a href="#maker">MakerWorld</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </nav>
        <div class="hr">
          <a class="lang" href="Eran_Buhbut_CV.pdf" download>CV</a>
          <button class="menu" id="menu" aria-label="Menu" aria-expanded="false" aria-controls="nav"><i></i><i></i><i></i></button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <div class="hero">
        <div>
          <h1>Mechanical engineering, in <mark>practice.</mark></h1>

          <div class="who">
            <div class="nm">Eran Buhbut</div>
            <div class="rl">Mechanical engineering student, Technion</div>
          </div>
        </div>

        <div class="plate">
          <div class="frame">
            <video aria-label="A short loop: a soft gripper lifting a toggle switch, its fingers closing, and a close-up of a small robot" src="media/hero.mp4" poster="media/hero-poster.jpg" autoplay muted loop playsinline></video>
          </div>
        </div>
      </div>

      <section id="projects">
        <h2>Projects</h2>

        <div class="pick">
          <button class="pk" data-t="1" aria-expanded="false" aria-controls="pp1">
            <div class="th">
              <img src="media/card-clamp.jpg" alt="Two silicone fingers closing on a small blue toggle switch">
            </div>
            <div class="bd">
              <div>
                <h3>Soft pneumatic gripper</h3>
                <small>Soft gripper closing on air pressure</small>
              </div>
              <span class="st">Working POC</span>
            </div>
          </button>
          <button class="pk" data-t="2" aria-expanded="false" aria-controls="pp2">
            <div class="th"><img src="media/mm-card.jpg" alt="Top view of the second version of a small robot: IR sensors on
